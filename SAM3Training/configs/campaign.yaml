campaign:
  name: comet_sam3_final
  seed: 20260830
  official_sam3_commit: 660a5e9e1b8b4c02c0ad97229b88a09a6e4ff5b7

paths:
  project_root: ../..
  data_root: Data
  current_labels: TrajectoryAxisLabeling/v4_test_session
  queue_csv: HeadLabeling/session_001/queue.csv
  manifest_dir: SAM3Training/training_data/manifests
  run_dir: SAM3Training/runs/comet_sam3_final
  # Set these as environment variables on the cluster. Tokens never belong here.
  sam3_repo_env: SAM3_REPO
  sam3_checkpoint_env: SAM3_CHECKPOINT

input:
  source_tile_size: 192
  sam_input_size: 1008
  background_blend: 0.5
  low_percentile: 1.0
  high_percentile: 99.7
  causal_channels_t: [-2, -1, 0]
  causal_channels_tp1: [-1, 0, 1]
  # Geometry only. No noise, blur, bleaching, or intensity augmentation.
  random_d8: true
  random_translation: true

procedural:
  # Per-comet exponential tail-decay mixture. A bin is selected first, then
  # the decay length is sampled uniformly inside that bin.
  decay_length_bins_pixels:
    - [3.0, 5.0]
    - [5.0, 18.0]
    - [18.0, 24.0]
    - [24.0, 28.0]
  decay_length_probabilities: [0.05, 0.70, 0.20, 0.05]

  # Moving-object events. A branch or merge transition keeps exact detection,
  # head, and axis targets but masks the structurally ambiguous link target.
  branch_probability: 0.08
  small_branch_fraction: 0.50
  small_branch_angle_degrees: [10.0, 14.0]
  small_branch_min_head_separation_pixels: 2.5
  branch_angle_degrees: [18.0, 55.0]
  branch_transition_min_head_separation_pixels: 2.5
  merge_probability: 0.05
  merge_approach_angle_degrees: [35.0, 75.0]
  merge_min_parent_separation_pixels: 3.0
  hotspot_probability: 0.25

  # Intrinsically rendered dynamic backgrounds. These are not post-hoc noise,
  # blur, intensity, or bleaching augmentations.
  background_drift_pixels_per_frame: [0.03, 0.24]
  transient_blob_probability: 0.45
  transient_blob_count: [1, 4]
  transient_blob_sigma_pixels: [2.0, 8.0]
  transient_blob_amplitude: [10.0, 44.0]
  transient_blob_speed_pixels_per_frame: [0.0, 0.30]
  microtubule_crowd_probability: 0.35
  microtubule_count: [8, 18]
  microtubule_length_pixels: [28.0, 92.0]
  microtubule_sigma_pixels: [0.65, 1.30]
  microtubule_amplitude: [7.0, 26.0]
  microtubule_wiggle_pixels: [0.15, 0.80]
  microtubule_drift_pixels_per_frame: [0.0, 0.12]

targets:
  axis_width_source_pixels: 3.0
  axis_edge_softness_source_pixels: 0.75
  head_sigma_source_pixels: 1.5
  taper_axis: false

model:
  checkpoint_version: sam3
  learned_single_class_embedding: true
  use_text_encoder_during_training: false
  number_of_queries: 200
  expected_mask_output_size: 288
  disable_dac_query_duplication: true
  track_embedding_dim: 128
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]

loss:
  matching:
    presence: 2.0
    box_l1: 2.0
    head_distance: 4.0
    axis_dice: 3.0
  training:
    presence_focal: 2.0
    box_l1: 1.0
    axis_focal: 4.0
    axis_dice: 2.0
    head_focal: 4.0
    head_coordinate: 2.0
    link_bce: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

training:
  epochs: 25
  pair_batch_size_per_gpu: 1
  gradient_accumulation_steps: 8
  num_workers: 4
  precision: bf16
  gradient_clip_norm: 1.0
  log_every_optimizer_steps: 20
  checkpoint_every_optimizer_steps: 500
  save_every_epochs: 1
  validate_every_epochs: 1
  full_validation_epochs: [5, 10, 15, 20, 21, 22, 23, 24, 25]
  source_sampling:
    # Avoid letting the 375 background rectangles swamp the 173 accepted pairs.
    current_positive_fraction: 0.75
    procedural_empty_fraction: 0.10
    procedural_frozen_fraction: 0.10
    materialization_retries: 12
  optimizer:
    name: adamw
    weight_decay: 0.05
    lr_new_heads: 0.0001
    lr_sam_decoder: 0.00002
    lr_vision_upper: 0.000002
    warmup_optimizer_steps: 1000
    scheduler: cosine
  freezing:
    freeze_language_backbone: true
    freeze_vision_through_epoch: 5
    unfreeze_upper_vision_blocks: 4
  phases:
    - name: long_synthetic_pretraining
      epochs: [1, 5]
      pairs_per_epoch: 6000
      sources: {procedural: 0.90, unet_paste: 0.08, current: 0.02}
    - name: synthetic_to_old_bridge
      epochs: [6, 10]
      pairs_per_epoch: 5000
      sources: {procedural: 0.65, unet_paste: 0.25, current: 0.10}
    - name: balanced_middle
      epochs: [11, 15]
      pairs_per_epoch: 4000
      sources: {procedural: 0.40, unet_paste: 0.35, current: 0.25}
    - name: current_annotation_ramp
      epochs: [16, 20]
      pairs_per_epoch: 3000
      sources: {procedural: 0.20, unet_paste: 0.30, current: 0.50}
    - name: current_annotation_finish
      epochs: [21, 25]
      pairs_per_epoch: 2500
      sources: {procedural: 0.05, unet_paste: 0.20, current: 0.75}

validation:
  no_test_split: true
  held_out_movies:
    - 20260710_pAJV103_0.25DOX-ON_010
    - 20260716_N271_0.25DOX_ON_002
  fixed_synthetic_seed: 20260831
  fixed_synthetic_pairs: 64
  checkpoint_priority:
    - certified_background_false_positives
    - head_p90_error_pixels
    - link_accuracy
    - axis_centerline_distance_pixels

constraints:
  pajv101_positive_training: false
  pajv101_evaluation: false
  pajv101_max_background_fraction: 0.15
  old_zero_pixels_are_background: false
  generic_rejects_are_negative: false
