[build-system]
requires = ["setuptools>=69,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-sam3-training"
version = "0.1.0"
description = "SAM3 multitask training for EB3 comet heads, axes, and links"
requires-python = ">=3.12"
dependencies = [
  "setuptools>=69,<81",
  "numpy>=1.26,<2",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "tifffile>=2024.8.30",
  "nd2>=0.10",
  "PyYAML>=6.0",
  "pandas>=2.2",
  "tqdm>=4.66",
  # Imported by the pinned SAM3 runtime but omitted from its core/train extras.
  "einops>=0.8",
  "pycocotools>=2.0.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["comet_sam3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
