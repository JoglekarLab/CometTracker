[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comet-tracker-v9"
version = "0.8.0"
description = "plusTipTracker-style two-stage LAP tracker for EB3 comets, driven by SAM3 masks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.20", "tifffile>=2023.1"]

[tool.setuptools.packages.find]
include = ["comet_tracker_v9*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
